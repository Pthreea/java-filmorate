# Application name
spring.application.name=filmorate

# Server configuration
server.port=8080

# ===================================
# Database Configuration
# ===================================

# H2 Database - ???????? ?? ??? ??????????
spring.datasource.url=jdbc:h2:file:./db/filmorate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (??? ???????)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===================================
# SQL Initialization
# ===================================

# ?????????????? ????????????? ??
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ===================================
# JPA/Hibernate Configuration
# ===================================

# ????????? Hibernate (?????????? JDBC)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================
# Logging Configuration
# ===================================

# ???????? ??????????
logging.level.root=INFO
logging.level.ru.yandex.practicum.filmorate=INFO

# ????????? ??????????? ? ???????? (??????-??????)
logging.level.ru.yandex.practicum.filmorate.service=DEBUG

# ??????????? ?????? ? ??
logging.level.ru.yandex.practicum.filmorate.storage=DEBUG

# HTTP ??????? (????? interceptor)
logging.level.ru.yandex.practicum.filmorate.config.RequestLoggingInterceptor=INFO

# Spring Framework - ??????? ????
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.org.springframework.jdbc.core=DEBUG

# Hibernate (???? ???????)
logging.level.org.hibernate=WARN

# H2 Database
logging.level.org.h2=WARN

# ===================================
# Logging Pattern
# ===================================

# ?????? ????? ? ???????
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ?????? ????? ? ????? (???? ????????????)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ???? ????? (???????????)
# logging.file.name=logs/filmorate.log
# logging.file.max-size=10MB
# logging.file.max-history=30

# ===================================
# Jackson Configuration
# ===================================

# ?????? ??? ? JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ???????????? ??????????? ????????
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===================================
# Validation Configuration
# ===================================

# ???????? Bean Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ===================================
# Actuator Configuration (???????????)
# ===================================

# Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Health check
management.health.defaults.enabled=true
management.health.diskspace.enabled=true

# Metrics
management.metrics.enable.http=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================
# Error Handling
# ===================================

# ?????????? ?????? ?????? (?????? ??? dev)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ===================================
# Encoding
# ===================================

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true